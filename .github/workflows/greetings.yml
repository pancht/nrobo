name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Thanks for opening your first issue — we appreciate your contribution and will review it soon!"
        pr-message: "🎉 Thanks for submitting your first pull request — we appreciate your contribution and will review it shortly!"
