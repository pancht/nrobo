[build-system]
requires = ["setuptools>=68.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "nrobo"
version = "2025.0.2"
description = "A Pytest-powered Smart Test Runner CLI tool."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Panchdev Singh Chauhan", email = "erpanchdev@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
  "pytest>=7.0",
  "pyyaml",
  "typer>=0.9",
  "rich",
  "pytest-html>=4.0.0",
  "allure-pytest>=2.13.5",
]

[project.scripts]
nrobo = "nrobo.cli:main"

[tool.setuptools.package-data]
"nrobo" = ["templates/*"]

[project.entry-points.pytest11]
nrobo = "nrobo.plugin"

[tool.bandit]
skips = ["B607", "B101"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pre-commit", "flake8", "codecov", "allure-pytest"]

# pyproject.toml

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
