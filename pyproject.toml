[build-system]
requires = ["setuptools>=68.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "nrobo"
version = "0.1.0"
description = "A Pytest-powered Smart Test Runner CLI tool."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Panchdev Singh Chauhan", email = "your.email@example.com" }
]
requires-python = ">=3.8"
dependencies = [
  "pytest>=7.0",
  "pyyaml",
  "typer>=0.9",
  "rich"
]

[project.scripts]
nrobo = "nrobo.cli:main"
